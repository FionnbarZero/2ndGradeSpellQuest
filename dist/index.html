<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191235" />
    <meta name="description" content="SpellCraft is a calm, guided civics vocabulary spelling tutor." />
    <link rel="icon" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>SpellCraft</title>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <header class="site-header">
      <button class="brand" id="home-button" type="button" aria-label="Return to day selection">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span>SpellCraft</span>
      </button>
      <div class="header-actions">
        <button class="quiet-button report-button" id="report-problem-button" type="button">
          <span aria-hidden="true">⚑</span> Report a problem
        </button>
        <button class="quiet-button" id="sound-button" type="button" aria-pressed="false">
          <span aria-hidden="true">🔊</span> Sound on
        </button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <dialog class="problem-dialog" id="problem-dialog" aria-labelledby="problem-dialog-title">
      <form class="problem-form" id="problem-form" method="dialog">
        <button class="dialog-close" id="problem-close" type="button" aria-label="Close problem report">×</button>
        <p class="eyebrow">Help improve SpellCraft</p>
        <h2 id="problem-dialog-title">Report a problem</h2>
        <p class="dialog-intro">Tell Codex what went wrong. A new Codex chat will open with your report ready for you to review and send.</p>
        <label for="problem-details">What happened?</label>
        <textarea id="problem-details" maxlength="1200" required placeholder="For example: I clicked the microphone, but no letters moved."></textarea>
        <p class="privacy-note"><span aria-hidden="true">◇</span> The report includes this screen and page address. It does not include saved scores, names, or spelling answers.</p>
        <p class="report-status" id="report-status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button class="secondary-button" id="copy-report" type="button">Copy report</button>
          <button class="primary-button" type="submit">Open in Codex <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </dialog>

    <footer>
      Progress stays on this device.
    </footer>

    <template id="sparkles-template">
      <div class="sparkles" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i></div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
